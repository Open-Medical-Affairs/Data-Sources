name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Synthetic banners, index and public catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generators are deterministic (no drift from committed files)
        run: |
          python3 synthetic/generate.py
          python3 tools/build_connected.py
          git diff --exit-code -- . ':(exclude)synthetic/connected/medical-affairs.sqlite'
      - name: Validate
        run: python3 tools/validate.py
